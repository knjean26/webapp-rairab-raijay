<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="รายรับ-รายจ่าย" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>บันทึกรายรับ-รายจ่าย</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, 'TH Sarabun New', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      color: #1e293b;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      padding: 14px 20px;
      padding-top: calc(14px + env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(79,70,229,.35);
      position: sticky;
      top: 0;
      z-index: 110;
    }
    .header h1 { font-size: 1.15rem; font-weight: 700; }
    .conn-badge {
      font-size: .72rem;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .conn-badge.ok      { background: rgba(16,185,129,.25); color: #6ee7b7; }
    .conn-badge.err     { background: rgba(239,68,68,.25);  color: #fca5a5; }
    .conn-badge.loading { background: rgba(255,255,255,.15); color: rgba(255,255,255,.7); }

    /* ── TOP NAV (desktop) ── */
    .top-nav {
      background: #fff;
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      position: sticky;
      top: 52px;
      z-index: 100;
    }
    .nav-btn {
      padding: 13px 28px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: .95rem;
      color: #64748b;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-weight: 500;
      transition: all .2s;
    }
    .nav-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }
    .nav-btn:hover:not(.active) { color: #1e293b; background: #f8fafc; }

    /* ── BOTTOM NAV (mobile) ── */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    .bottom-nav-inner { display: flex; }
    .bnav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border: none;
      background: none;
      cursor: pointer;
      color: #94a3b8;
      gap: 2px;
      font-weight: 600;
      font-size: .65rem;
      transition: color .2s;
      min-height: 58px;
    }
    .bnav-icon { font-size: 1.35rem; line-height: 1; }
    .bnav-btn.active { color: #4f46e5; }

    /* ── PAGES ── */
    .page { display: none; padding: 16px; max-width: 960px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* ── FORM ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.span2 { grid-column: span 2; }
    label {
      font-size: .75rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input[type="text"],
    input[type="number"],
    input[type="date"],
    select {
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      color: #1e293b;
      background: #fff;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
      min-height: 50px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }

    /* ── BUTTONS ── */
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      padding: 15px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      transition: opacity .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
    }
    .btn-primary:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #e2e8f0;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background .2s;
      min-height: 50px;
    }
    .btn-cancel:hover { background: #e2e8f0; }

    /* ── SUMMARY CARDS ── */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .s-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
      text-align: center;
    }
    .s-card .s-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #64748b; margin-bottom: 5px; }
    .s-card .s-amount { font-size: 1.35rem; font-weight: 800; }
    .s-card .s-sub { font-size: .7rem; color: #94a3b8; margin-top: 4px; }
    .s-card.inc .s-amount { color: #10b981; }
    .s-card.exp .s-amount { color: #ef4444; }
    .s-card.bal .s-amount { color: #4f46e5; }

    /* ── CHARTS ── */
    .charts-grid { display: grid; grid-template-columns: 3fr 1.4fr; gap: 14px; margin-bottom: 14px; }
    .chart-box { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    .chart-box .chart-title { font-size: .73rem; font-weight: 700; color: #374151; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .06em; }

    /* ── PERIOD PILLS ── */
    .period-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .period-row h2 { font-size: 1rem; font-weight: 700; }
    .period-pills { display: flex; gap: 6px; }
    .p-pill {
      padding: 6px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      color: #64748b;
      transition: all .2s;
      min-height: 36px;
    }
    .p-pill.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }

    /* ── DASHBOARD FILTERS ── */
    .filter-card { padding: 14px 16px; margin-bottom: 14px; }
    .filter-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
    .filter-group label { font-size: .68rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: .05em; }
    .filter-group select {
      padding: 8px 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: .88rem;
      color: #1e293b;
      background: #fff;
      min-height: 40px;
      width: 100%;
      cursor: pointer;
    }
    .filter-group select:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .filter-group select.active-filter { border-color: #4f46e5; background: #eef2ff; color: #4338ca; font-weight: 600; }
    .btn-reset {
      padding: 8px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #f1f5f9;
      color: #64748b;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
      white-space: nowrap;
      align-self: flex-end;
      transition: background .2s;
    }
    .btn-reset:hover { background: #e2e8f0; }

    /* ── RECORD CARDS ── */
    .rec-list { display: flex; flex-direction: column; gap: 10px; }
    .rec-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 13px 15px;
      border-left: 4px solid transparent;
      border: 1px solid #f1f5f9;
      border-left-width: 4px;
    }
    .rec-card.is-inc { border-left-color: #10b981; }
    .rec-card.is-exp { border-left-color: #ef4444; }
    .rec-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }
    .rec-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rec-cat { font-size: .9rem; font-weight: 600; color: #1e293b; }
    .rec-amount { font-size: 1.05rem; font-weight: 800; flex-shrink: 0; }
    .rec-bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .rec-date { font-size: .75rem; color: #94a3b8; white-space: nowrap; }
    .rec-note { font-size: .78rem; color: #64748b; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rec-btns { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }

    /* ── BADGE ── */
    .badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge.inc { background: #dcfce7; color: #16a34a; }
    .badge.exp { background: #fee2e2; color: #dc2626; }

    /* ── ACTION BUTTONS ── */
    .act-btn {
      padding: 6px 12px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 700;
      transition: opacity .15s;
      min-height: 34px;
    }
    .act-btn:hover { opacity: .8; }
    .act-btn.edit { background: #e0e7ff; color: #4338ca; }
    .act-btn.del  { background: #fee2e2; color: #dc2626; }
    .act-btn.dup  { background: #f0fdfa; color: #0d9488; }

    /* ── MANAGE BUTTON ── */
    .label-row { display: flex; align-items: center; justify-content: space-between; }
    .manage-btn {
      background: none; border: none; cursor: pointer;
      font-size: .68rem; color: #94a3b8; padding: 2px 7px;
      border-radius: 5px; font-weight: 700; letter-spacing: .02em;
      transition: color .15s, background .15s;
    }
    .manage-btn:hover { color: #4f46e5; background: #eef2ff; }

    /* ── MANAGEMENT MODAL ── */
    .mgmt-list { max-height: 240px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .mgmt-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 11px; border-radius: 8px;
      background: #f8fafc; font-size: .88rem; color: #1e293b;
    }
    .mgmt-item-default { opacity: .6; }
    .mgmt-default-badge {
      font-size: .62rem; font-weight: 700; color: #94a3b8;
      background: #e2e8f0; padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
    }
    .mgmt-del-btn {
      background: none; border: none; cursor: pointer;
      color: #dc2626; font-size: .85rem; padding: 2px 7px;
      border-radius: 5px; flex-shrink: 0; transition: background .15s;
    }
    .mgmt-del-btn:hover { background: #fee2e2; }
    .mgmt-add-row { display: flex; gap: 8px; }
    .mgmt-input {
      flex: 1; padding: 9px 12px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: .9rem; color: #1e293b; min-height: 42px;
    }
    .mgmt-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .mgmt-add-btn {
      padding: 9px 16px; background: #4f46e5; color: #fff;
      border: none; border-radius: 8px; font-weight: 700;
      cursor: pointer; font-size: .88rem; white-space: nowrap;
      min-height: 42px; transition: opacity .15s;
    }
    .mgmt-add-btn:hover { opacity: .85; }
    .mgmt-hint {
      font-size: .75rem; color: #92400e; margin-top: 10px;
      padding: 8px 12px; background: #fef9c3; border-radius: 7px; line-height: 1.5;
    }
    .mgmt-hint:empty { display: none; }

    /* ── SEARCH BAR ── */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .8rem; pointer-events: none; }
    .search-input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      font-size: .9rem;
      color: #1e293b;
      background: #f8fafc;
      min-height: 42px;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-input:focus { outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }

    /* ── DUPLICATE MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 600;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal-box {
      background: #fff; border-radius: 16px; padding: 24px;
      width: 100%; max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      transform: scale(.95); transition: transform .25s;
    }
    .modal-overlay.show .modal-box { transform: scale(1); }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
    .modal-info {
      font-size: .82rem; color: #475569;
      background: #f8fafc; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 14px; line-height: 1.6;
    }
    .modal-info strong { color: #1e293b; }
    .modal-label { font-size: .75rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; display: block; }
    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
    .modal-btns .btn-cancel  { margin-top: 0; flex: 1; }
    .modal-btns .btn-primary { margin-top: 0; flex: 2; }

    /* ── MISC ── */
    .refresh-link { background: none; border: none; color: #4f46e5; cursor: pointer; font-size: .82rem; font-weight: 600; padding: 4px 8px; }
    .refresh-link:hover { text-decoration: underline; }
    .empty-state { text-align: center; padding: 32px; color: #94a3b8; font-size: .9rem; }

    /* ── EDIT BANNER ── */
    .edit-banner {
      display: none;
      background: #fef3c7;
      border: 1.5px solid #fde68a;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: .85rem;
      color: #92400e;
      font-weight: 600;
      align-items: center;
      gap: 10px;
    }
    .edit-banner.show { display: flex; }
    .edit-banner span { flex: 1; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      right: 20px;
      padding: 13px 18px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: .9rem;
      z-index: 9999;
      transform: translateY(80px);
      opacity: 0;
      transition: all .3s cubic-bezier(.4,0,.2,1);
      max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #10b981; }
    .toast.error   { background: #ef4444; }
    .toast.info    { background: #4f46e5; }

    /* ── SPINNER ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE: tablet ── */
    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.span2 { grid-column: span 1; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .summary-grid .s-card:last-child { grid-column: span 2; }
      .charts-grid { grid-template-columns: 1fr; }
    }

    /* ── RESPONSIVE: mobile ── */
    @media (max-width: 600px) {
      .top-nav { display: none; }
      .bottom-nav { display: block; }
      body { padding-bottom: calc(env(safe-area-inset-bottom) + 64px); }
      .page { padding: 12px; }
      .header { top: 0; }
      .toast {
        bottom: calc(76px + env(safe-area-inset-bottom));
        right: 12px; left: 12px;
        max-width: none;
      }
      .s-card .s-amount { font-size: 1.15rem; }
      .period-row { flex-wrap: wrap; gap: 8px; }
    }

    @media (max-width: 420px) {
      .summary-grid { grid-template-columns: 1fr; }
      .summary-grid .s-card:last-child { grid-column: span 1; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>💰 รายรับ-รายจ่าย</h1>
  <span class="conn-badge loading" id="connBadge">
    <span class="spinner" style="width:10px;height:10px;border-width:1.5px;vertical-align:middle;margin-right:4px;"></span>
    กำลังเชื่อมต่อ...
  </span>
</div>

<!-- TOP NAV (desktop) -->
<div class="top-nav">
  <button class="nav-btn active" data-page="entry" onclick="switchPage('entry')">📝 บันทึกรายการ</button>
  <button class="nav-btn"        data-page="dashboard" onclick="switchPage('dashboard')">📊 แดชบอร์ด</button>
</div>

<!-- ═══ ENTRY PAGE ═══ -->
<div class="page active" id="entryPage">

  <div class="card">
    <div class="card-title" id="formTitle">📋 บันทึกรายการใหม่</div>
    <div class="edit-banner" id="editBanner">
      <span>✏️ โหมดแก้ไขรายการ — แถวที่ <strong id="editRowLabel"></strong></span>
      <button class="act-btn edit" onclick="cancelEdit()">ยกเลิก ✕</button>
    </div>
    <div class="form-grid">

      <div class="form-group">
        <label>วันที่</label>
        <input type="date" id="txDate" />
      </div>

      <div class="form-group">
        <label class="label-row">ประเภท <button class="manage-btn" onclick="openMgmt('type')">⚙️ จัดการ</button></label>
        <select id="txType" onchange="onTypeChange(this.value)"></select>
      </div>

      <div class="form-group">
        <label class="label-row">หมวดหมู่ <button class="manage-btn" onclick="openMgmt('cat')">⚙️ จัดการ</button></label>
        <select id="txCategory">
          <option value="">-- เลือกหมวดหมู่ --</option>
        </select>
      </div>

      <div class="form-group">
        <label>จำนวนเงิน (บาท)</label>
        <input type="number" id="txAmount" placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
      </div>

      <div class="form-group span2">
        <label>หมายเหตุ <span style="font-weight:400;text-transform:none;font-size:.75rem;">(ไม่จำเป็น)</span></label>
        <input type="text" id="txNote" placeholder="รายละเอียดเพิ่มเติม..." autocomplete="off" />
      </div>

    </div>
    <button class="btn-primary" id="submitBtn" onclick="submitEntry()">
      บันทึกรายการ
    </button>
    <button class="btn-cancel" id="cancelBtn" style="display:none" onclick="cancelEdit()">
      ยกเลิกการแก้ไข
    </button>
  </div>

  <div class="card">
    <div class="card-title">
      <span>📄 รายการล่าสุด</span>
      <button class="refresh-link" onclick="loadRecentEntries(true)">รีเฟรช ↻</button>
    </div>

function parseAmount(v) {
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/[฿,\s]/g, '')) || 0;
}

function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T00:00:00');
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
    const [d, m, y] = s.split('/').map(Number);
    return new Date(y, m - 1, d);
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

//  TOKEN
// ═══════════════════════════════════════════════════
let _accessToken  = null;
let _tokenExpires = 0;

async function getToken() {
  if (_accessToken && Date.now() < _tokenExpires - 60_000) return _accessToken;
  _accessToken  = await fetchNewToken();
  _tokenExpires = Date.now() + 3_600_000;
  return _accessToken;
}

function b64url(input) {
  let bytes = typeof input === 'string' ? new TextEncoder().encode(input) : new Uint8Array(input);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function importPrivateKey(pem) {
  const clean = pem.replace(/-----BEGIN PRIVATE KEY-----/, '').replace(/-----END PRIVATE KEY-----/, '').replace(/\s+/g, '');
  const binary = atob(clean);
  const buf = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) buf[i] = binary.charCodeAt(i);
  return crypto.subtle.importKey('pkcs8', buf.buffer, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
}

async function makeJWT() {
  const now  = Math.floor(Date.now() / 1000);
  const head = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
  const body = b64url(JSON.stringify({ iss: SA_EMAIL, scope: SCOPE, aud: TOKEN_URL, iat: now, exp: now + 3600 }));
  const signingInput = `${head}.${body}`;
  const key = await importPrivateKey(SA_PRIVATE_KEY);
  const sig  = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(signingInput));
  return `${signingInput}.${b64url(sig)}`;
}

async function fetchNewToken() {
  const jwt = await makeJWT();
  const res = await fetch(TOKEN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`,
  });
  const data = await res.json();
  if (!data.access_token) throw new Error(data.error_description || 'Token request failed');
  return data.access_token;
}

async function sheetsGet(range) {
  const tok = await getToken();
  const res = await fetch(`${SHEETS_BASE}/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`, {
    headers: { Authorization: `Bearer ${tok}` },
  });
  if (!res.ok) throw new Error(`Sheets GET failed: ${res.status}`);
  return res.json();
}

async function sheetsAppend(range, values) {
  const tok = await getToken();
  const res = await fetch(
    `${SHEETS_BASE}/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
    { method: 'POST', headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values }) }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Sheets append failed: ${res.status}`);
  }
  return res.json();
}

async function sheetsUpdate(range, values) {
  const tok = await getToken();
  const res = await fetch(
    `${SHEETS_BASE}/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,
    { method: 'PUT', headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values }) }
  );
  if (!res.ok) throw new Error(`Sheets update failed: ${res.status}`);
  return res.json();
}

let _inputSheetId = null;

async function getInputSheetId() {
  if (_inputSheetId !== null) return _inputSheetId;
  const tok = await getToken();
  const res = await fetch(`${SHEETS_BASE}/${SPREADSHEET_ID}?fields=sheets.properties`, { headers: { Authorization: `Bearer ${tok}` } });
  const meta = await res.json();
  const sheet = (meta.sheets || []).find(s => s.properties.title === SHEET_NAME);
  if (!sheet) throw new Error('Sheet not found: ' + SHEET_NAME);
  _inputSheetId = sheet.properties.sheetId;
  return _inputSheetId;
}

async function sheetsDeleteRow(sheetRowNumber) {
  const tok     = await getToken();
  const sheetId = await getInputSheetId();
  const res = await fetch(`${SHEETS_BASE}/${SPREADSHEET_ID}:batchUpdate`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{ deleteDimension: { range: { sheetId, dimension: 'ROWS', startIndex: sheetRowNumber - 1, endIndex: sheetRowNumber } } }],
    }),
  });
  if (!res.ok) throw new Error(`Sheets delete failed: ${res.status}`);
  return res.json();
}

async function ensureHeader() {

    if (!r.values || r.values[0]?.length === 0) {
      await sheetsUpdate(`'${SHEET_NAME}'!A1:E1`, [['Date','Type','Category','Amount','Note']]);
    }
  } catch (_) {}

function loadCategories() {
  const sel  = document.getElementById('txCategory');
  const prev = sel.value;
  const cats = [...FALLBACK_CATS, ...getCustomCats()];
  sel.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>';
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}

function loadTypeOptions() {
  const sel  = document.getElementById('txType');
  const prev = sel.value;
  sel.innerHTML = '';
  [...DEFAULT_TYPES, ...getCustomTypes().map(t => ({ value: t, label: t }))].forEach(t => {
    const o = document.createElement('option');
    o.value = t.value; o.textContent = t.label;
    sel.appendChild(o);
  });
  sel.value = prev || 'รายจ่าย (Debit)';
  if (!sel.value) sel.value = 'รายจ่าย (Debit)';

async function submitEntry() {
  const date     = document.getElementById('txDate').value;
  const txType   = document.getElementById('txType').value;
  const category = document.getElementById('txCategory').value;
  const amount   = document.getElementById('txAmount').value;
  const note     = document.getElementById('txNote').value.trim();

  if (!date)                              { showToast('กรุณาเลือกวันที่', 'error'); return; }
  if (!category)                          { showToast('กรุณาเลือกหมวดหมู่', 'error'); return; }
  if (!amount || parseFloat(amount) <= 0) { showToast('กรุณากรอกจำนวนเงิน', 'error'); return; }

  const [y, m, d] = date.split('-');
  const dateFormatted = `${parseInt(d)}/${parseInt(m)}/${y}`;
  const rowValues = [dateFormatted, txType, category, `฿${parseFloat(amount).toFixed(2)}`, note];

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> กำลังบันทึก...';

  try {
    if (editingSheetRow !== null) {
      await sheetsUpdate(`'${SHEET_NAME}'!A${editingSheetRow}:E${editingSheetRow}`, [rowValues]);
      showToast('✅ แก้ไขสำเร็จ!', 'success');
      cancelEdit();
    } else {
      await sheetsAppend(`'${SHEET_NAME}'!A:E`, [rowValues]);
      showToast('✅ บันทึกสำเร็จ!', 'success');
      document.getElementById('txAmount').value = '';
      document.getElementById('txNote').value   = '';
      document.getElementById('txDate').valueAsDate = new Date();
    }
    cachedData = [];
    await loadRecentEntries(true);
    loadDashboard(true);
  } catch (e) {
    showToast('บันทึกไม่สำเร็จ: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = (editingSheetRow !== null) ? '💾 บันทึกการแก้ไข' : 'บันทึกรายการ';
  }
}

function editRow(sheetRow, encodedJson) {
  const [date, type, cat, amount, note] = JSON.parse(encodedJson);

  let dateVal = '';
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(date)) {
    const [dd, mm, yyyy] = date.split('/');
    dateVal = `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
  } else {
    dateVal = date;
  }

  document.getElementById('txDate').value     = dateVal;
  document.getElementById('txType').value     = type;
  document.getElementById('txCategory').value = cat;
  document.getElementById('txAmount').value   = parseAmount(amount);
  document.getElementById('txNote').value     = note;
  onTypeChange(type);

  editingSheetRow = sheetRow;
  document.getElementById('formTitle').textContent   = '✏️ แก้ไขรายการ';
  document.getElementById('editBanner').classList.add('show');
  document.getElementById('editRowLabel').textContent = sheetRow;
  document.getElementById('submitBtn').innerHTML      = '💾 บันทึกการแก้ไข';
  document.getElementById('cancelBtn').style.display = 'block';

  switchPage('entry');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingSheetRow = null;
  document.getElementById('formTitle').textContent    = '📋 บันทึกรายการใหม่';
  document.getElementById('editBanner').classList.remove('show');
  document.getElementById('submitBtn').innerHTML      = 'บันทึกรายการ';
  document.getElementById('cancelBtn').style.display = 'none';
  document.getElementById('txDate').valueAsDate = new Date();
  document.getElementById('txType').value       = TYPE_DEBIT;
  document.getElementById('txCategory').value  = '';
  document.getElementById('txAmount').value     = '';
  document.getElementById('txNote').value       = '';
  onTypeChange(TYPE_DEBIT);
}

async function deleteRow(sheetRow, label) {
  if (!confirm(`ยืนยันลบรายการวันที่ ${label} ?`)) return;
  try {
    await sheetsDeleteRow(sheetRow);
    showToast('🗑️ ลบรายการสำเร็จ', 'success');
    cachedData = [];
    await loadRecentEntries(true);
    loadDashboard(true);
  } catch (e) {
    showToast('ลบไม่สำเร็จ: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════
async function fetchAllData(force = false) {
  if (cachedData.length > 0 && !force) return cachedData;
  try {
    const r = await sheetsGet(`'${SHEET_NAME}'!A2:E50000`);
    cachedData = [];
    (r.values || []).forEach((row, i) => {
      if (row && row.length >= 4 && row[0] && row[3]) {
        row._row = i + 2;
        cachedData.push(row);
      }
    });
    return cachedData;
  } catch (e) {
    showToast('โหลดข้อมูลไม่สำเร็จ', 'error');
    return [];
  }
}

async function loadRecentEntries(force = false) {
  await fetchAllData(force);
  renderRecentList();
}

function filterRecent() { renderRecentList(); }

function renderRecentList() {
  const q  = (document.getElementById('searchRecent')?.value || '').toLowerCase().trim();
  const el = document.getElementById('recentList');
  if (cachedData.length === 0) {
    el.innerHTML = '<div class="empty-state">ยังไม่มีรายการ — เริ่มบันทึกรายการแรกได้เลย!</div>';
    return;
  }
  let rows = [...cachedData].sort((a, b) => (parseDate(b[0])||0) - (parseDate(a[0])||0)).slice(0, 15);
  if (q) rows = rows.filter(r => (r[4]||'').toLowerCase().includes(q));
  if (rows.length === 0) {
    el.innerHTML = `<div class="empty-state">ไม่พบหมายเหตุที่มีคำว่า "${q}"</div>`;
    return;
  }
  el.innerHTML = rows.map(r => rowHtml(r, true)).join('');
}

// ═══════════════════════════════════════════════════
//  DASHBOARD FILTERS
// ═══════════════════════════════════════════════════
let _dashInitialized = false;

function getFilters() {
  return {
    year:     document.getElementById('filterYear')?.value     || '',
    month:    document.getElementById('filterMonth')?.value    || '',
    type:     document.getElementById('filterType')?.value     || '',
    category: document.getElementById('filterCategory')?.value || '',
  };
}

function populateYearFilter(data) {
  const sel = document.getElementById('filterYear');
  const prev = sel.value;
  const years = [...new Set(data.map(r => {
    const d = parseDate(r[0]);
    return d ? d.getFullYear() : null;
  }).filter(Boolean))].sort((a, b) => b - a);
  sel.innerHTML = '<option value="">ทุกปี</option>';
  years.forEach(y => {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}

function populateCategoryFilter() {
  const sel  = document.getElementById('filterCategory');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '<option value="">ทุกหมวดหมู่</option>';
  [...FALLBACK_CATS, ...getCustomCats()].forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}

function populateTypeFilter() {
  const sel = document.getElementById('filterType');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '<option value="">ทุกประเภท</option>';
  [...DEFAULT_TYPES, ...getCustomTypes().map(t => ({ value: t, label: t }))].forEach(t => {
    const o = document.createElement('option');
    o.value = t.value; o.textContent = t.label;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}

function highlightActiveFilters() {
  const f = getFilters();
  ['filterYear','filterMonth','filterType','filterCategory'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active-filter', !!el.value);
  });
}

function applyFilters() {
  document.querySelectorAll('.p-pill').forEach(b => b.classList.remove('active'));
  highlightActiveFilters();
  renderDashboard();
}

function resetFilters() {
  document.getElementById('filterYear').value     = '';
  document.getElementById('filterMonth').value    = '';
  document.getElementById('filterType').value     = '';
  document.getElementById('filterCategory').value = '';
  document.querySelectorAll('.p-pill').forEach(b => b.classList.remove('active'));
  document.querySelector('.p-pill[data-period="all"]').classList.add('active');
  highlightActiveFilters();
  renderDashboard();
}

// ═══════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════
function setPeriod(btn) {
  document.querySelectorAll('.p-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const now = new Date();
  const period = btn.dataset.period;
  if (period === 'month') {
    document.getElementById('filterYear').value  = now.getFullYear();
    document.getElementById('filterMonth').value = now.getMonth() + 1;
  } else if (period === 'year') {
    document.getElementById('filterYear').value  = now.getFullYear();
    document.getElementById('filterMonth').value = '';
  } else {
    document.getElementById('filterYear').value  = '';
    document.getElementById('filterMonth').value = '';
  }
  document.getElementById('filterType').value     = '';
  document.getElementById('filterCategory').value = '';
  highlightActiveFilters();
  renderDashboard();
}

async function loadDashboard(force = false) {
  const data = await fetchAllData(force);
  populateYearFilter(data);
  if (!_dashInitialized) {
    _dashInitialized = true;
    populateCategoryFilter();
    populateTypeFilter();
    const now = new Date();
    document.getElementById('filterYear').value  = now.getFullYear();
    document.getElementById('filterMonth').value = now.getMonth() + 1;
    highlightActiveFilters();
  }
  renderDashboard();
}

function renderDashboard() {
  const data = cachedData;
  const f    = getFilters();
  const q    = (document.getElementById('searchAll')?.value || '').toLowerCase().trim();

  let filtered = data.filter(r => {
    const d = parseDate(r[0]);
    if (!d || isNaN(d)) return false;
    if (f.year     && d.getFullYear()  !== parseInt(f.year))  return false;
    if (f.month    && d.getMonth() + 1 !== parseInt(f.month)) return false;
    if (f.type     && r[1] !== f.type)     return false;
    if (f.category && r[2] !== f.category) return false;
    return true;
  });

  // Search applies to everything — charts, summary, and list
  if (q) filtered = filtered.filter(r => (r[4] || '').toLowerCase().includes(q));

  const incRows = filtered.filter(r => (r[1] || '').includes('รายรับ'));
  const expRows = filtered.filter(r => (r[1] || '').includes('รายจ่าย'));
  const income  = incRows.reduce((s, r) => s + parseAmount(r[3]), 0);
  const expense = expRows.reduce((s, r) => s + parseAmount(r[3]), 0);
  const balance = income - expense;

  document.getElementById('sumIncome').textContent       = fmt(income);
  document.getElementById('sumIncomeCount').textContent  = incRows.length + ' รายการ';
  document.getElementById('sumExpense').textContent      = fmt(expense);
  document.getElementById('sumExpenseCount').textContent = expRows.length + ' รายการ';
  document.getElementById('sumBalance').textContent      = fmt(Math.abs(balance));
  document.getElementById('sumBalance').style.color      = balance >= 0 ? '#10b981' : '#ef4444';
  document.getElementById('sumBalanceSub').textContent   = balance >= 0 ? '✅ บวก' : '⚠️ ติดลบ';

  renderBarChart(filtered);
  renderPieChart(filtered);
  renderAllTable(filtered, q);
}

function renderBarChart(filtered) {
  const income  = filtered.filter(r => (r[1]||'').includes('รายรับ')).reduce((s,r) => s + parseAmount(r[3]), 0);
  const expense = filtered.filter(r => (r[1]||'').includes('รายจ่าย')).reduce((s,r) => s + parseAmount(r[3]), 0);
  if (barChartInst) barChartInst.destroy();
  barChartInst = new Chart(document.getElementById('barChart'), {
    type: 'doughnut',
    data: {
      labels: ['รายรับ', 'รายจ่าย'],
      datasets: [{
        data: [income, expense],
        backgroundColor: ['rgba(16,185,129,.85)', 'rgba(239,68,68,.85)'],
        borderColor:     ['#10b981', '#ef4444'],
        borderWidth: 2,
        hoverOffset: 10,
      }],
    },
    options: {
      responsive: true,
      cutout: '62%',
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 14, usePointStyle: true } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)}` } },
        datalabels: {
          color: '#fff',
          font: { size: 11, weight: '700' },
          formatter: (v, ctx) => {
            const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
            if (!total || v === 0) return '';
            const pct = Math.round(v / total * 100);
            return pct < 5 ? '' : `${pct}%\n${fmt(v)}`;
          },
          textAlign: 'center',
        },
      },
    },
    plugins: [ChartDataLabels],
  });
}

function renderPieChart(filtered) {
  const byCat = {};
  filtered.filter(r => (r[1]||'').includes('รายจ่าย')).forEach(r => {
    const c = r[2] || 'Other';
    byCat[c] = (byCat[c] || 0) + parseAmount(r[3]);
  });
  const COLORS  = ['#4f46e5','#ef4444','#f59e0b','#10b981','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6b7280','#0ea5e9','#a855f7'];
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (pieChartInst) pieChartInst.destroy();

  if (entries.length === 0) {
    pieChartInst = new Chart(document.getElementById('pieChart'), {
      type: 'bar',
      data: { labels: ['ไม่มีข้อมูล'], datasets: [{ data: [0], backgroundColor: ['#e2e8f0'] }] },
      options: { responsive: true, plugins: { datalabels: { display: false }, legend: { display: false } } },
    });
    return;
  }

  pieChartInst = new Chart(document.getElementById('pieChart'), {
    type: 'bar',
    data: {
      labels: entries.map(e => e[0]),
      datasets: [{
        data:            entries.map(e => e[1]),
        backgroundColor: entries.map((_, i) => COLORS[i % COLORS.length]),
        borderRadius:    6,
        borderSkipped:   false,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } },
        datalabels: {
          anchor: 'end',
          align:  'end',
          color:  '#374151',
          font:   { size: 10, weight: '700' },
          formatter: (v, ctx) => {
            const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
            const pct = total > 0 ? Math.round(v / total * 100) : 0;
            return '฿' + Math.round(v).toLocaleString('th-TH') + '  (' + pct + '%)';
          },
        },
      },
      scales: {
        x: {
          beginAtZero: true,
          grid: { color: 'rgba(0,0,0,.05)' },
          ticks: { callback: v => '฿' + (v/1000 >= 1 ? Math.round(v/1000)+'k' : v.toLocaleString('th-TH')), font: { size: 10 } },
        },
        y: { ticks: { font: { size: 11 } } },
      },
      layout: { padding: { right: 100 } },
    },
    plugins: [ChartDataLabels],
  });
}

function renderAllTable(data, q = '') {
  const el = document.getElementById('allList');
  if (data.length === 0) {
    el.innerHTML = q
      ? `<div class="empty-state">ไม่พบหมายเหตุที่มีคำว่า "${q}"</div>`
      : '<div class="empty-state">ไม่มีข้อมูลในช่วงเวลาที่เลือก</div>';
    return;
  }
  el.innerHTML = [...data].sort((a, b) => (parseDate(b[0])||0) - (parseDate(a[0])||0)).map(r => rowHtml(r, false)).join('');
}

function filterAll() { renderDashboard(); }

// ═══════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════
function rowHtml(r, showDup = false) {
  const isInc     = (r[1] || '').includes('รายรับ');
  const typeLabel = r[1] || '';
  const sheetRow  = r._row;
  const encoded   = encodeURIComponent(JSON.stringify([r[0], r[1], r[2], r[3], r[4] || '']));
  const dupBtn    = showDup
    ? `<button class="act-btn dup" data-enc="${encoded}" onclick="duplicateRow(this)">📋 ทำซ้ำ</button>`
    : '';
  return `<div class="rec-card ${isInc ? 'is-inc' : 'is-exp'}">
    <div class="rec-top">
      <div class="rec-left">
        <span class="badge ${isInc ? 'inc' : 'exp'}">${isInc ? 'รายรับ' : typeLabel.replace('รายจ่าย ', '')}</span>
        <span class="rec-cat">${r[2] || ''}</span>
      </div>
      <span class="rec-amount" style="color:${isInc ? '#10b981' : '#ef4444'}">${isInc ? '+' : '-'}${fmt(parseAmount(r[3]))}</span>
    </div>
    <div class="rec-bottom">
      <span class="rec-date">${fmtDate(r[0])}</span>
      <span class="rec-note">${r[4] || ''}</span>
      <div class="rec-btns">
        ${dupBtn}
        <button class="act-btn edit" onclick="editRow(${sheetRow}, decodeURIComponent('${encoded}'))">✏️ แก้ไข</button>
        <button class="act-btn del"  onclick="deleteRow(${sheetRow}, '${r[0]}')">🗑️ ลบ</button>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════
//  MANAGEMENT MODAL (categories & types)
// ═══════════════════════════════════════════════════
let _mgmtMode = '';

function openMgmt(mode) {
  _mgmtMode = mode;
  const isCat = mode === 'cat';
  document.getElementById('mgmtTitle').textContent = isCat ? '🏷️ จัดการหมวดหมู่' : '📂 จัดการประเภท';
  document.getElementById('mgmtNewInput').placeholder = isCat
    ? 'เช่น Freelance, Bonus...'
    : 'เช่น รายรับ (โบนัส) หรือ รายจ่าย (ผ่อน)...';
  document.getElementById('mgmtHint').textContent = isCat
    ? ''
    : '💡 เริ่มต้นด้วย "รายรับ" หรือ "รายจ่าย" เพื่อให้ระบบจำแนกประเภทได้ถูกต้อง';
  renderMgmtList();
  document.getElementById('mgmtModal').classList.add('show');
  setTimeout(() => document.getElementById('mgmtNewInput').focus(), 100);
}

function closeMgmt() {
  document.getElementById('mgmtModal').classList.remove('show');
  document.getElementById('mgmtNewInput').value = '';
  _mgmtMode = '';
}

function renderMgmtList() {
  const el    = document.getElementById('mgmtList');
  const isCat = _mgmtMode === 'cat';
  const defaults = isCat
    ? FALLBACK_CATS.map(c => ({ label: c }))
    : DEFAULT_TYPES.map(t => ({ label: t.label }));
  const customs = isCat ? getCustomCats() : getCustomTypes();

  el.innerHTML =
    defaults.map(d =>
      `<div class="mgmt-item mgmt-item-default">
        <span>${d.label}</span>
        <span class="mgmt-default-badge">ค่าเริ่มต้น</span>
      </div>`
    ).join('') +
    customs.map((c, i) =>
      `<div class="mgmt-item">
        <span>${c}</span>
        <button class="mgmt-del-btn" onclick="mgmtDeleteItem(${i})" title="ลบ">✕</button>
      </div>`
    ).join('') +
    (customs.length === 0 ? `<div style="text-align:center;color:#94a3b8;font-size:.82rem;padding:10px 0">ยังไม่มีรายการที่กำหนดเอง</div>` : '');
}

function mgmtAddItem() {
  const input = document.getElementById('mgmtNewInput');
  const name  = input.value.trim();
  if (!name) return;

  if (_mgmtMode === 'cat') {
    const all = [...FALLBACK_CATS, ...getCustomCats()];
    if (all.find(c => c.toLowerCase() === name.toLowerCase())) {
      showToast('หมวดหมู่นี้มีอยู่แล้ว', 'error'); return;
    }
    const arr = getCustomCats();
    arr.push(name);
    saveCustomCats(arr);
    loadCategories();
    populateCategoryFilter();
  } else {
    const allDef = DEFAULT_TYPES.map(t => t.value.toLowerCase());
    const allCus = getCustomTypes().map(t => t.toLowerCase());
    if ([...allDef, ...allCus].includes(name.toLowerCase())) {
      showToast('ประเภทนี้มีอยู่แล้ว', 'error'); return;
    }
    const arr = getCustomTypes();
    arr.push(name);
    saveCustomTypes(arr);
    loadTypeOptions();
    populateTypeFilter();
  }

  input.value = '';
  renderMgmtList();
  showToast('✅ เพิ่มสำเร็จ', 'success');
}

function mgmtDeleteItem(index) {
  if (_mgmtMode === 'cat') {
    const arr = getCustomCats();
    arr.splice(index, 1);
    saveCustomCats(arr);
    loadCategories();
    populateCategoryFilter();
  } else {
    const arr = getCustomTypes();
    arr.splice(index, 1);
    saveCustomTypes(arr);
    loadTypeOptions();
    populateTypeFilter();
  }
  renderMgmtList();
  showToast('ลบแล้ว', 'info');
}

// ═══════════════════════════════════════════════════
//  DUPLICATE
// ═══════════════════════════════════════════════════
let _dupData = null;

function duplicateRow(btn) {
  _dupData = JSON.parse(decodeURIComponent(btn.dataset.enc));
  // Set today in local time (valueAsDate uses UTC which can show yesterday in UTC+7)
  const t = new Date();
  document.getElementById('dupDate').value =
    `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  const isInc = (_dupData[1]||'').includes('รายรับ');
  document.getElementById('dupInfo').innerHTML =
    `<strong>${_dupData[2]}</strong> &nbsp;|&nbsp; ${_dupData[1].replace('รายจ่าย ','')}<br>` +
    `<span style="color:${isInc?'#10b981':'#ef4444'};font-weight:700">${isInc?'+':'-'}${fmt(parseAmount(_dupData[3]))}</span>` +
    (_dupData[4] ? `&nbsp;&nbsp;<span style="color:#94a3b8">${_dupData[4]}</span>` : '');
  document.getElementById('dupModal').classList.add('show');
}

function closeDupModal() {
  document.getElementById('dupModal').classList.remove('show');
  _dupData = null;
}

async function confirmDuplicate() {
  if (!_dupData) return;
  const dateInput = document.getElementById('dupDate').value;
  if (!dateInput) { showToast('กรุณาเลือกวันที่', 'error'); return; }
  let [y, m, d] = dateInput.split('-').map(Number);
  if (y > 2500) y -= 543; // convert Buddhist Era → Christian Era
  const dateFormatted = `${d}/${m}/${y}`;
  const amount = `฿${parseAmount(_dupData[3]).toFixed(2)}`;
  const rowValues = [dateFormatted, _dupData[1], _dupData[2], amount, _dupData[4] || ''];
  const btn = document.getElementById('dupSaveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> กำลังบันทึก...';
  try {
    await sheetsAppend(`'${SHEET_NAME}'!A:E`, [rowValues]);
    showToast('✅ ทำซ้ำสำเร็จ!', 'success');
    closeDupModal();
    cachedData = [];
    await loadRecentEntries(true);
    loadDashboard(true);
  } catch (e) {
    showToast('ทำซ้ำไม่สำเร็จ: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '💾 บันทึกสำเนา';
  }
}

function fmt(v) {
  return '฿' + (parseFloat(v) || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return '';
  try {
    const dt = parseDate(d);
    if (!dt || isNaN(dt)) return d;
    return dt.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
  } catch (_) { return d; }
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));
  document.getElementById(name + 'Page').classList.add('active');
  document.querySelectorAll(`[data-page="${name}"]`).forEach(b => b.classList.add('active'));
  if (name === 'dashboard') loadDashboard(false);
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}
